<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CSS animation and transition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a365d;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 40px;
        }

        h1 {
            color: #ffeb3b;
            text-align: center;
        }

        /* Button with transition */
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: yellow;
            color: black;
        }

        button:active {
            background-color: red;
            color: white;
        }

        /* Square with animation */
        .square {
            width: 150px;
            height: 150px;
            background-color: #E5E6E5;
            border-radius: 10px;
            animation: colorChange 5s infinite;
        }

        @keyframes colorChange {
            0%   { background-color: #E5E6E5; }
            20%  { background-color: #D8D0C7; }
            40%  { background-color: #C4A887; }
            60%  { background-color: #A6703A; }
            80%  { background-color: #673D20; }
            100% { background-color: #E5E6E5; }
        }
    </style>
</head>
<body>
    <h1>The CSS Animation and Transition</h1>
    
    <button>Hover and Click Me!</button>
    
    <div class="square"></div>
</body>
</html>
