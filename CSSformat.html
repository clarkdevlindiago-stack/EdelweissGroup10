<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CSS Border, Margins, Paddings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .box {
            border: 3px solid red;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            background-color: white;
            max-width: 600px;
        }

        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>My Dream Job</h1>
        <p>
            My dream job is to become a accountant.Because it is a stepping stone to become a business man 
          i want to become a business man become i want to make my life comfortable and give back to the people who supported me
        </p>
    </div>
</body>
</html>
